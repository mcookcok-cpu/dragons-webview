name: Build Android APK (Cordova)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle-required SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      - name: Build debug APK
        run: cordova build android --no-telemetry

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find platforms/android -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Built APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragons-webview-debug-apk
          path: ${{ steps.apk.outputs.path }}
